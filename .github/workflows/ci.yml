name: CI
"on":
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - master
  workflow_dispatch: {}
env:
  LORRI_NO_INSTALL_PANIC_HANDLER: absolutely
jobs:
  j01-go-test-ubuntu-latest:
    name: Go tests (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Nix
        uses: cachix/install-nix-action@v26
      - name: Cachix
        uses: cachix/cachix-action@v14
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: nix-community
      - name: Run CI tests
        run: |
          nix develop --command go run ./cmd/ci test
  j02-nix-build-ubuntu-latest:
    name: nix build (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Nix
        uses: cachix/install-nix-action@v26
      - name: Cachix
        uses: cachix/cachix-action@v14
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: nix-community
      - name: Build
        run: |
          nix build
  j11-go-test-macos-latest:
    name: Go tests (macos-latest)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Nix
        uses: cachix/install-nix-action@v26
      - name: Cachix
        uses: cachix/cachix-action@v14
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: nix-community
      - name: Run CI tests
        run: |
          nix develop --command go run ./cmd/ci test
  j12-nix-build-macos-latest:
    name: nix build (macos-latest)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Nix
        uses: cachix/install-nix-action@v26
      - name: Cachix
        uses: cachix/cachix-action@v14
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: nix-community
      - name: Build
        run: |
          nix build
