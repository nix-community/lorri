name: CI
"on":
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - master
  workflow_dispatch: {}
env:
  LORRI_NO_INSTALL_PANIC_HANDLER: absolutely
jobs:
  j01-go-test-ubuntu-latest:
    name: Go tests (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Nix
        uses: cachix/install-nix-action@v26
      - name: Cachix
        uses: cachix/cachix-action@v14
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: nix-community
      - name: Run CI tests
        run: |
          NIX_PATH="nixpkgs=$(nix-build ./nix/nixpkgs-stable.nix --no-out-link)" \
            nix run nixpkgs#go -- run ./cmd/ci test
  j02-nix-build_stable-ubuntu-latest:
    name: nix-build [nixos stable] (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Nix
        uses: cachix/install-nix-action@v26
      - name: Cachix
        uses: cachix/cachix-action@v14
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: nix-community
      - name: Build
        run: |
          nix-build
      - name: Install
        run: |
          nix-env -i ./result
  j03-overlay-ubuntu-latest:
    name: Overlay builds (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Nix
        uses: cachix/install-nix-action@v26
      - name: Cachix
        uses: cachix/cachix-action@v14
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: nix-community
      - name: Build w/ overlay (stable)
        run: |
          nix-build ./nix/overlay.nix -A lorri --arg pkgs ./nix/nixpkgs-stable.json
  j11-go-test-macos-latest:
    name: Go tests (macos-latest)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Nix
        uses: cachix/install-nix-action@v26
      - name: Cachix
        uses: cachix/cachix-action@v14
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: nix-community
      - name: Run CI tests
        run: |
          NIX_PATH="nixpkgs=$(nix-build ./nix/nixpkgs-stable.nix --no-out-link)" \
            nix run nixpkgs#go -- run ./cmd/ci test
  j12-nix-build_stable-macos-latest:
    name: nix-build [nixos stable] (macos-latest)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Nix
        uses: cachix/install-nix-action@v26
      - name: Cachix
        uses: cachix/cachix-action@v14
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: nix-community
      - name: Build
        run: |
          nix-build
      - name: Install
        run: |
          nix-env -i ./result
  j13-overlay-macos-latest:
    name: Overlay builds (macos-latest)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Nix
        uses: cachix/install-nix-action@v26
      - name: Cachix
        uses: cachix/cachix-action@v14
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: nix-community
      - name: Build w/ overlay (stable)
        run: |
          nix-build ./nix/overlay.nix -A lorri --arg pkgs ./nix/nixpkgs-stable.json
