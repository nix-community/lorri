[package]
name = "lorri"
# See MAINTAINERS.md for details about versioning
version = "1.8.0" # Format: MAJOR.MINOR.0
authors = [
  "Graham Christensen <graham.christensen@target.com>",
  "Profpatsch <mail@profpatsch.de>",
]
homepage = "https://github.com/nix-community/lorri"
license = "Apache-2.0"
edition = "2021"

# before updating dependencies: we want to keep the rustc compatible with 1.41.0 for now (start of 2020).
[dependencies]
# central features
notify = "6.1.1"
atomicwrites = "0.4.4"
crossbeam-channel = "0.5.14"
nix = {  version = "0.29.0", features = ["poll", "fs"], default-features = true }
regex = "1.11.1"
tempfile = "3.16.0"
anyhow = "1.0.95"
thiserror = "2.0.11"

# TODO: update to 0.3
structopt = { version = "0.2", default-features = true, features = ["suggestions", "color", "no_cargo"] }

# logging;
slog = { version = "2.7.0", features = [
  "release_max_level_debug",
] } # enable debug messages in the release so that --verbose still works
slog-term = "2.9.1"
fastrand = "2.3.0"
# serialization
serde = "1.0.217"
serde_derive = "1.0.217"
serde_json = "1.0.138"
# nice-to-have
ctrlc = { version = "3.4.5", features = ["termination"] }
directories = "6.0.0"
lazy_static = "1.5.0"
md5 = "0.7.0"
vec1 = "1.12.1"
tokio = { features = ["rt", "rt-multi-thread", "macros", "net", "time", "io-util", "io-std", "sync"], version = "1.43.0" }
human-panic = { path = "vendor/human-panic" }
notify-debouncer-full = { version = "0.3.1", default-features = false }

[dev-dependencies]
# 1.0.0 requires at least rust 1.50
proptest.version = "0.10.1"
# 1.0.0 requires at least rust 1.50
proptest.default-features = false
# 1.0.0 requires at least rust 1.50
proptest.features = [
  "std",
  # reenable if proptest kills the test runner
  # "fork",
  # "timeout"
]
